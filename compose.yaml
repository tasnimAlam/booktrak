services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bookshelf}   # created on first start
      # Read by db/init/03-roles.sh to create one login role per service
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      BOOKS_DB_PASSWORD: ${BOOKS_DB_PASSWORD:?set BOOKS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # *.sql here runs on first start only
    # Needed for pg_stat_statements (section 11)
    command: postgres -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Each service is reachable only on the compose network (no published ports); the gateway is the way in.
  auth:
    build: { context: ., target: auth }
    init: true   # tiny init as PID 1: forwards SIGTERM and reaps zombies
    environment:
      DATABASE_URL: postgres://auth_svc:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB:-bookshelf}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}   # signs tokens
    depends_on:
      db:
        condition: service_healthy
    healthcheck: &health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  books:
    build: { context: ., target: books }
    init: true
    environment:
      DATABASE_URL: postgres://books_svc:${BOOKS_DB_PASSWORD}@db:5432/${POSTGRES_DB:-bookshelf}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}   # only verifies tokens
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *health
    restart: unless-stopped

  # Caddy: routes /api/auth -> auth, /api/books -> books, everything else -> built web app.
  gateway:
    build: { context: ., target: gateway }
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      auth:
        condition: service_healthy
      books:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
